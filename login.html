<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login – SkillSwap</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Project Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- ========================================================================
       Navigation Bar
       ======================================================================== -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="index.html">
        <span class="brand-icon-wrapper">
          <i class="bi bi-mortarboard-fill"></i>
        </span>
        <span>Skill<span class="text-primary">Swap</span></span>
      </a>

      <div class="ms-auto d-flex align-items-center gap-2">
        <span class="small text-muted d-none d-sm-inline">New student?</span>
        <a href="register.html" class="btn btn-sm btn-outline-custom">Create Account</a>
      </div>
    </div>
  </nav>

  <!-- ========================================================================
       Auth Content
       ======================================================================== -->
  <div class="auth-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          
          <div class="auth-card">
            <!-- Header -->
            <div class="text-center mb-4">
              <span class="brand-icon-wrapper mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.4rem;">
                <i class="bi bi-person-lock"></i>
              </span>
              <h3 class="fw-bold text-dark mb-1">Student Portal Login</h3>
              <p class="text-muted small">Sign in with your university credentials to manage swaps</p>
            </div>

            <!-- Demo Login Pill for Teachers / Evaluators -->
            <div class="demo-account-pill mb-4 d-flex align-items-center justify-content-between">
              <div>
                <strong class="text-dark d-block"><i class="bi bi-mortarboard-fill text-warning me-1"></i> Quick Project Evaluation</strong>
                <span class="text-muted" style="font-size: 0.78rem;">Click button to auto-fill sample student credentials</span>
              </div>
              <button type="button" id="btnDemoLogin" class="btn btn-sm btn-warning text-dark fw-bold">
                Auto Fill
              </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label-custom">University Email Address</label>
                <div class="search-input-group">
                  <i class="bi bi-envelope"></i>
                  <input type="email" class="form-control" id="loginEmail" placeholder="student.name@university.edu" required>
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label-custom mb-0">Password</label>
                  <a href="#" class="small text-muted" onclick="showCustomToast('Password Reset', 'Password recovery link has been simulated.'); return false;">Forgot password?</a>
                </div>
                <div class="search-input-group">
                  <i class="bi bi-shield-lock"></i>
                  <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                  <label class="form-check-label small text-muted" for="rememberMe">
                    Keep me signed in
                  </label>
                </div>
              </div>

              <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                <i class="bi bi-box-arrow-in-right"></i> Log In to SkillSwap
              </button>

              <div class="text-center">
                <span class="text-muted small">Don't have an account yet? </span>
                <a href="register.html" class="small fw-bold">Register as a Student</a>
              </div>
            </form>

          </div>

          <div class="text-center mt-3">
            <a href="index.html" class="text-muted small">
              <i class="bi bi-arrow-left"></i> Return to Home
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Main Project JS -->
  <script src="js/main.js"></script>
</body>
</html>
